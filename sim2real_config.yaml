artifact:
  model_path: ./policy_full.pt
  runtime: torchscript_or_libtorch
  dtype: float32
  single_file_delivery: true

deployment_recommendation:
  mode: merged_torchscript
  separate_cenet_loader_required: false
  reason: policy_full.pt already contains the BarrierDreamWaQ CENet and actor inference path

policy_interface:
  inputs:
    history:
      shape: [1, 1290]
      meaning: 10-step proprio history for DolangH1 (40 DoF)
    current:
      shape: [1, 129]
      meaning: current proprio frame for DolangH1 (40 DoF)
  output:
    actions:
      shape: [1, 40]
      meaning: 40 joint actions before action_scale and PD conversion

input_order:
  - history
  - current

observation_contract:
  history_len: 10
  current_dim: 129
  history_dim: 1290
  proprio_group_order:
    - base_ang_vel
    - projected_gravity
    - velocity_commands
    - joint_pos
    - joint_vel
    - actions
  per_frame_layout:
    base_ang_vel:
      dim: 3
      source: imu_gyro_body_frame
      scale: 0.25
    projected_gravity:
      dim: 3
      source: gravity projected into body frame
      scale: 1.0
    velocity_commands:
      dim: 3
      source: commanded [vx, vy, wz]
      scale: 1.0
    joint_pos:
      dim: 40
      source: q - q_default
      scale: 1.0
    joint_vel:
      dim: 40
      source: dq
      scale: 0.05
    actions:
      dim: 40
      source: previous applied action
      scale: 1.0
  history_flatten_rule: concatenate each group oldest_to_newest, then concatenate groups in proprio_group_order
  actor_only_inputs:
    - base_ang_vel
    - projected_gravity
    - velocity_commands
    - joint_pos
    - joint_vel
    - actions
  critic_only_terms_not_needed:
    - base_lin_vel
    - height_scan_feet

control_contract:
  physics_dt_s: 0.005
  decimation: 4
  control_period_s: 0.02
  control_rate_hz: 50
  init_base_height: 0.95
  config_template: dolanga1_mujoco_sim2sim/deploy_mujoco/configs/dolangh1.yaml
  action_clip_before_pd: [-100.0, 100.0]
  torque_formula: q_target = q_default + action_scale * clip(action, -100.0, 100.0); tau = kp * (q_target - q) - kd * dq

runtime_state:
  history_init: repeat_first_frame_until_full
  initial_previous_action: zeros
  update_history_period: control_period_s
  policy_call_period: control_period_s

command_ranges_seen_in_training:
  lin_vel_x: [0.0, 1.0]
  lin_vel_y: [0.0, 0.0]
  ang_vel_z: [0.0, 0.0]

model_internal_contract:
  cenet_input:
    name: history
    shape: [1, 1290]
    meaning: 10-step proprio history
    layout: group_major_oldest_to_newest

  cenet_output:
    - name: v_est
      meaning: estimated base_lin_vel (3D)
    - name: z
      meaning: context latent_mu (16D)
    - name: terrain_latent
      meaning: terrain latent (8D, flat training uses terrain_loss_weight=0)

  actor_input:
    source: concat(current, v_est, z, terrain_latent)
    order:
      - current
      - v_est
      - z
      - terrain_latent

  normalizer:
    applied_to: concat(current, v_est, z, terrain_latent)
    before: mlp
    not_applied_to: history_before_cenet

  current_source:
    rule: latest control frame
    should_match_history_last_frame: true
